# GitLab CI/CD for Vercel Deployment
# Based on: https://vercel.com/kb/guide/how-can-i-use-github-actions-with-vercel
image: registry.redhat.io/ubi8/nodejs-18:latest

stages:
  - build
  - deploy

variables:
  NODE_ENV: production

# Default settings for all jobs
default:
  tags:
    - shared-podman

# Cache disabled due to S3 upload timeouts in Red Hat GitLab environment
# cache:
#   key: ${CI_COMMIT_REF_SLUG}
#   paths:
#     - .npm/
#   policy: pull-push

# Vercel Preview Deployment for hale-nb20-migration branch
deploy-preview:
  stage: deploy
  variables:
    VERCEL_ORG_ID: $VERCEL_ORG_ID
    VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  script:
    - echo "Installing dependencies..."
    - npm ci --include=dev
    - echo "Installing Vercel CLI..."
    - npm install --global vercel@latest
    - echo "Pulling Vercel environment information..."
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - echo "Building project artifacts..."
    - vercel build --token=$VERCEL_TOKEN
    - echo "Deploying to Vercel Preview..."
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN
  only:
    - hale-nb20-migration
  when: on_success

# Vercel Production Deployment (for when hale-nb20-migration is merged to main)
deploy-production:
  stage: deploy
  variables:
    VERCEL_ORG_ID: $VERCEL_ORG_ID
    VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  script:
    - echo "Installing dependencies..."
    - npm ci --include=dev
    - echo "Installing Vercel CLI..."
    - npm install --global vercel@latest
    - echo "Pulling Vercel environment information..."
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - echo "Building project artifacts for production..."
    - vercel build --prod --token=$VERCEL_TOKEN
    - echo "Deploying to Vercel Production..."
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  only:
    - main
  when: on_success

# GitLab Pages deployment for rhoai-3.1 branch (keeping existing functionality)
build:
  stage: build
  script:
    - echo "Installing dependencies (including devDependencies for build tools)..."
    - npm ci --include=dev
    - echo "Setting up environment for build..."
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - echo "Verifying build tools are available..."
    - which tsc || echo "TypeScript compiler not found - will use npx fallback"
    - echo "Running build process..."
    - npm run build
    - echo "Preparing files for GitLab Pages..."
    # GitLab Pages expects files in a 'public' directory
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - rhoai-3.1

pages:
  stage: deploy
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public
  only:
    - rhoai-3.1
